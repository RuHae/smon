[project]
name = "smon"
version = "0.5.3"
description = "smon: A TUI dashboard for Slurm-managed HPC clusters."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ruben Härle", email = "ruben.harle@gmail.com" },
    { name = "Maurice Kraus", email = "dev@mkraus.io" }
]
keywords = ["hpc", "slurm", "dashboard", "tui", "monitoring", "smon"]
dependencies = [
    "rich>=14.3.1",
    "textual>=7.5.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.18.0",
    "pytest>=8.4.0",
]

[project.scripts]
smon = "main:app.run"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
